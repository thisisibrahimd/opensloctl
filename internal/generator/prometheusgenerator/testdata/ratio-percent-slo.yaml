apiVersion: openslo/v1
kind: SLO
metadata:
  name: test-ratio-target-percent
spec:
  description: Test SLO with targetPercent instead of target
  service: test-svc
  indicator:
    metadata:
      name: test-ratio-percent-sli
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: sum(rate(http_requests_total{status=~"2.."}[{{.Window}}]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: sum(rate(http_requests_total[{{.Window}}]))
  budgetingMethod: Occurrences
  timeWindow:
    - duration: 30d
      isRolling: true
  objectives:
    - displayName: "99.9% success rate"
      targetPercent: 99.9
