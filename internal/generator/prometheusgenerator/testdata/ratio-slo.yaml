apiVersion: openslo/v1
kind: Service
metadata:
  name: test-svc
spec:
  description: Test service
---
apiVersion: openslo/v1
kind: SLO
metadata:
  name: test-ratio-slo
spec:
  description: Test SLO with RatioMetric (good over total)
  service: test-svc
  indicator:
    metadata:
      name: test-ratio-sli
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: sum(rate(http_requests_total{status=~"2.."}[{{.Window}}]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: sum(rate(http_requests_total[{{.Window}}]))
  budgetingMethod: Occurrences
  timeWindow:
    - duration: 30d
      isRolling: true
  objectives:
    - displayName: "99.9% success rate"
      target: 0.999
