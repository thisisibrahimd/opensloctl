      labels:
        openslo_slo_name: test-ratio-slo
        openslo_spec_version: openslo/v1
        openslo_service_name: test-svc
  - name: openslo-status-recordings-test-ratio-slo
    rules:
    - record: openslo_slo_status
      expr: |
        (
          (openslo_slo_current_burn_rate{openslo_slo_name="test-ratio-slo", openslo_spec_version="openslo/v1"} >= bool 14.4)
          * 3
        )
        or
        (
          (openslo_slo_current_burn_rate{openslo_slo_name="test-ratio-slo", openslo_spec_version="openslo/v1"} >= bool 6)
          and
          (openslo_slo_current_burn_rate{openslo_slo_name="test-ratio-slo", openslo_spec_version="openslo/v1"} <  bool 14.4)
          * 2
        )
        or
        (
          (openslo_slo_current_burn_rate{openslo_slo_name="test-ratio-slo", openslo_spec_version="openslo/v1"} >= bool 1)
          and
          (openslo_slo_current_burn_rate{openslo_slo_name="test-ratio-slo", openslo_spec_version="openslo/v1"} <  bool 6)
          * 1
        )
      labels:
        openslo_slo_name: test-ratio-slo
        openslo_spec_version: openslo/v1
        openslo_service_name: test-svc
