groups:
  - name: openslo-info-recordings-test-multi-dim-slo
    rules:
    - record: openslo_slo_info_unlabeled
      expr: vector(1)
      labels:
        openslo_slo_name: test-multi-dim-slo
        openslo_spec_version: openslo/v1
        openslo_service_name: test-multi-dim-svc
    - record: openslo_slo_objective_unlabeled
      expr: vector(0.999)
      labels:
        openslo_slo_name: test-multi-dim-slo
        openslo_spec_version: openslo/v1
        openslo_service_name: test-multi-dim-svc
    - record: openslo_slo_timewindow_days_unlabeled
      expr: vector(30)
      labels:
        openslo_slo_name: test-multi-dim-slo
        openslo_spec_version: openslo/v1
        openslo_service_name: test-multi-dim-svc
    - record: openslo_slo_error_budget_unlabeled
      expr: vector(1- 0.999)
      labels:
        openslo_slo_name: test-multi-dim-slo
        openslo_spec_version: openslo/v1
        openslo_service_name: test-multi-dim-svc
    - record: openslo_slo_current_burn_rate_unlabeled
      expr: |
        openslo_sli_error_rate_5m{openslo_slo_name="test-multi-dim-slo", openslo_spec_version="openslo/v1"}
        / on(openslo_slo_name, openslo_spec_version) group_left
        openslo_slo_error_budget{openslo_slo_name="test-multi-dim-slo", openslo_spec_version="openslo/v1"}
      labels:
        openslo_slo_name: test-multi-dim-slo
        openslo_spec_version: openslo/v1
        openslo_service_name: test-multi-dim-svc
    - record: openslo_slo_period_burn_rate_unlabeled
      expr: |
        openslo_sli_error_rate_30d{openslo_slo_name="test-multi-dim-slo", openslo_spec_version="openslo/v1"}
        / on(openslo_slo_name, openslo_spec_version) group_left
        openslo_slo_error_budget{openslo_slo_name="test-multi-dim-slo", openslo_spec_version="openslo/v1"}
      labels:
        openslo_slo_name: test-multi-dim-slo
        openslo_spec_version: openslo/v1
        openslo_service_name: test-multi-dim-svc
    - record: openslo_slo_period_error_budget_remaining_unlabeled
      expr: clamp_min(1 - openslo_slo_period_burn_rate_unlabeled{openslo_slo_name="test-multi-dim-slo", openslo_spec_version="openslo/v1"}, 0)
      labels:
        openslo_slo_name: test-multi-dim-slo
        openslo_spec_version: openslo/v1
        openslo_service_name: test-multi-dim-svc
    - record: openslo_slo_info
      expr: label_join(openslo_slo_info_unlabeled{openslo_slo_name="test-multi-dim-slo", openslo_spec_version="openslo/v1"}, 'openslo_slo_name', '-', 'openslo_slo_name', 'service_name')
      labels:
        openslo_spec_version: openslo/v1
    - record: openslo_slo_objective
      expr: label_join(openslo_slo_objective_unlabeled{openslo_slo_name="test-multi-dim-slo", openslo_spec_version="openslo/v1"}, 'openslo_slo_name', '-', 'openslo_slo_name', 'service_name')
      labels:
        openslo_spec_version: openslo/v1
    - record: openslo_slo_timewindow_days
      expr: label_join(openslo_slo_timewindow_days_unlabeled{openslo_slo_name="test-multi-dim-slo", openslo_spec_version="openslo/v1"}, 'openslo_slo_name', '-', 'openslo_slo_name', 'service_name')
      labels:
        openslo_spec_version: openslo/v1
    - record: openslo_slo_error_budget
      expr: label_join(openslo_slo_error_budget_unlabeled{openslo_slo_name="test-multi-dim-slo", openslo_spec_version="openslo/v1"}, 'openslo_slo_name', '-', 'openslo_slo_name', 'service_name')
      labels:
        openslo_spec_version: openslo/v1
    - record: openslo_slo_current_burn_rate
      expr: |
        label_join(openslo_sli_error_rate_5m_unlabeled{openslo_slo_name="test-multi-dim-slo", openslo_spec_version="openslo/v1"}, 'openslo_slo_name', '-', 'openslo_slo_name', 'service_name')
        / on(openslo_slo_name, openslo_spec_version) group_left
        openslo_slo_error_budget{openslo_slo_name="test-multi-dim-slo", openslo_spec_version="openslo/v1"}
      labels:
        openslo_spec_version: openslo/v1
    - record: openslo_slo_period_burn_rate
      expr: |
        label_join(openslo_sli_error_rate_30d_unlabeled{openslo_slo_name="test-multi-dim-slo", openslo_spec_version="openslo/v1"}, 'openslo_slo_name', '-', 'openslo_slo_name', 'service_name')
        / on(openslo_slo_name, openslo_spec_version) group_left
        openslo_slo_error_budget{openslo_slo_name="test-multi-dim-slo", openslo_spec_version="openslo/v1"}
      labels:
        openslo_spec_version: openslo/v1
    - record: openslo_slo_period_error_budget_remaining
      expr: clamp_min(1 - openslo_slo_period_burn_rate{openslo_slo_name="test-multi-dim-slo", openslo_spec_version="openslo/v1"}, 0)
      labels:
        openslo_spec_version: openslo/v1
  - name: openslo-sli-recordings-test-multi-dim-slo
    rules:
    - record: openslo_sli_error_rate_5m_unlabeled
      expr: histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{job="api"}[5m])) by (le))
      labels:
        openslo_slo_name: test-multi-dim-slo
        openslo_spec_version: openslo/v1
        openslo_service_name: test-multi-dim-svc
    - record: openslo_sli_error_rate_30m_unlabeled
