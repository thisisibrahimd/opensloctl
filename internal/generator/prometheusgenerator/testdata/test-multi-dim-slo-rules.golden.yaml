        openslo_spec_version: openslo/v1
        openslo_service_name: test-multi-dim-svc
    - record: openslo_sli_error_rate_30d_unlabeled
      expr: histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{job="api"}[30d])) by (le))
      labels:
        openslo_slo_name: test-multi-dim-slo
        openslo_spec_version: openslo/v1
        openslo_service_name: test-multi-dim-svc
    - record: openslo_sli_error_rate_5m
      expr: label_join(openslo_sli_error_rate_5m_unlabeled{openslo_slo_name="test-multi-dim-slo", openslo_spec_version="openslo/v1"}, 'openslo_slo_name', '-', 'openslo_slo_name', 'service_name')
      labels:
