    - record: openslo_sli_error_rate_6h
      expr: label_join(openslo_sli_error_rate_6h_unlabeled{openslo_slo_name="test-multi-dim-slo", openslo_spec_version="openslo/v1"}, 'openslo_slo_name', '-', 'openslo_slo_name', 'service_name')
      labels:
        openslo_spec_version: openslo/v1
    - record: openslo_sli_error_rate_1d
      expr: label_join(openslo_sli_error_rate_1d_unlabeled{openslo_slo_name="test-multi-dim-slo", openslo_spec_version="openslo/v1"}, 'openslo_slo_name', '-', 'openslo_slo_name', 'service_name')
      labels:
        openslo_spec_version: openslo/v1
    - record: openslo_sli_error_rate_3d
      expr: label_join(openslo_sli_error_rate_3d_unlabeled{openslo_slo_name="test-multi-dim-slo", openslo_spec_version="openslo/v1"}, 'openslo_slo_name', '-', 'openslo_slo_name', 'service_name')
      labels:
        openslo_spec_version: openslo/v1
    - record: openslo_sli_error_rate_7d
      expr: label_join(openslo_sli_error_rate_7d_unlabeled{openslo_slo_name="test-multi-dim-slo", openslo_spec_version="openslo/v1"}, 'openslo_slo_name', '-', 'openslo_slo_name', 'service_name')
      labels:
        openslo_spec_version: openslo/v1
    - record: openslo_sli_error_rate_28d
      expr: label_join(openslo_sli_error_rate_28d_unlabeled{openslo_slo_name="test-multi-dim-slo", openslo_spec_version="openslo/v1"}, 'openslo_slo_name', '-', 'openslo_slo_name', 'service_name')
      labels:
        openslo_spec_version: openslo/v1
    - record: openslo_sli_error_rate_30d
      expr: label_join(openslo_sli_error_rate_30d_unlabeled{openslo_slo_name="test-multi-dim-slo", openslo_spec_version="openslo/v1"}, 'openslo_slo_name', '-', 'openslo_slo_name', 'service_name')
      labels:
        openslo_spec_version: openslo/v1
  - name: openslo-status-recordings-test-multi-dim-slo
    rules:
    - record: openslo_slo_status_unlabeled
      expr: |
        (
          (openslo_slo_current_burn_rate_unlabeled{openslo_slo_name="test-multi-dim-slo", openslo_spec_version="openslo/v1"}} >= 14.4)
          * 3
        )
        or
        (
          (openslo_slo_current_burn_rate_unlabeled{openslo_slo_name="test-multi-dim-slo", openslo_spec_version="openslo/v1"}} >= 6)
          and
          (openslo_slo_current_burn_rate_unlabeled{openslo_slo_name="test-multi-dim-slo", openslo_spec_version="openslo/v1"}} <  14.4)
          * 2
        )
        or
        (
          (openslo_slo_current_burn_rate_unlabeled{openslo_slo_name="test-multi-dim-slo", openslo_spec_version="openslo/v1"}} >= 1)
          and
          (openslo_slo_current_burn_rate_unlabeled{openslo_slo_name="test-multi-dim-slo", openslo_spec_version="openslo/v1"}} <  6)
          * 1
        )
      labels:
        openslo_slo_name: test-multi-dim-slo
        openslo_spec_version: openslo/v1
        openslo_service_name: test-multi-dim-svc
    - record: openslo_slo_status
      expr: label_join(openslo_slo_status_unlabeled{openslo_slo_name="test-multi-dim-slo", openslo_spec_version="openslo/v1"}, 'openslo_slo_name', '-', 'openslo_slo_name', 'service_name')
      labels:
        openslo_spec_version: openslo/v1
