        )
        
      labels:
        openslo_slo_name: test-multiline-slo
        openslo_spec_version: openslo/v1
        openslo_service_name: test-svc
    - record: openslo_sli_error_rate_28d
      expr: |
        histogram_quantile(0.99,
          sum(rate(http_request_duration_seconds_bucket{service="test-svc"}[28d]))
          by (le)
        )
        
      labels:
        openslo_slo_name: test-multiline-slo
        openslo_spec_version: openslo/v1
        openslo_service_name: test-svc
    - record: openslo_sli_error_rate_30d
      expr: |
        histogram_quantile(0.99,
          sum(rate(http_request_duration_seconds_bucket{service="test-svc"}[30d]))
          by (le)
        )
        
      labels:
        openslo_slo_name: test-multiline-slo
        openslo_spec_version: openslo/v1
        openslo_service_name: test-svc
  - name: openslo-status-recordings-test-multiline-slo
    rules:
    - record: openslo_slo_status
      expr: |
        (
          (openslo_slo_current_burn_rate{openslo_slo_name="test-multiline-slo", openslo_spec_version="openslo/v1"} >= 14.4)
          * 3
        )
        or
        (
          (openslo_slo_current_burn_rate{openslo_slo_name="test-multiline-slo", openslo_spec_version="openslo/v1"} >= 6)
          and
          (openslo_slo_current_burn_rate{openslo_slo_name="test-multiline-slo", openslo_spec_version="openslo/v1"} <  14.4)
          * 2
        )
        or
        (
          (openslo_slo_current_burn_rate{openslo_slo_name="test-multiline-slo", openslo_spec_version="openslo/v1"} >= 1)
          and
          (openslo_slo_current_burn_rate{openslo_slo_name="test-multiline-slo", openslo_spec_version="openslo/v1"} <  6)
          * 1
        )
      labels:
        openslo_slo_name: test-multiline-slo
        openslo_spec_version: openslo/v1
        openslo_service_name: test-svc
