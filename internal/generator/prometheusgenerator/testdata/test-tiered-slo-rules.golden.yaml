groups:
  - name: openslo-info-recordings-test-tiered-slo
    rules:
    - record: openslo_slo_info
      expr: vector(1)
      labels:
        openslo_slo_name: test-tiered-slo
        openslo_spec_version: openslo/v1
        openslo_service_name: test-svc
    - record: openslo_slo_objective
      expr: vector(0.999)
      labels:
        openslo_slo_name: test-tiered-slo
        openslo_spec_version: openslo/v1
        openslo_service_name: test-svc
    - record: openslo_slo_timewindow_days
      expr: vector(30)
      labels:
        openslo_slo_name: test-tiered-slo
        openslo_spec_version: openslo/v1
        openslo_service_name: test-svc
    - record: openslo_slo_error_budget
      expr: vector(1- 0.999)
      labels:
        openslo_slo_name: test-tiered-slo
        openslo_spec_version: openslo/v1
        openslo_service_name: test-svc
    - record: openslo_slo_current_burn_rate
      expr: |
        openslo_sli_error_rate_5m{openslo_slo_name="test-tiered-slo", openslo_spec_version="openslo/v1"}
        / on(openslo_slo_name, openslo_spec_version) group_left
        openslo_slo_error_budget{openslo_slo_name="test-tiered-slo", openslo_spec_version="openslo/v1"}
      labels:
        openslo_slo_name: test-tiered-slo
        openslo_spec_version: openslo/v1
        openslo_service_name: test-svc
    - record: openslo_slo_period_burn_rate
      expr: |
        openslo_sli_error_rate_30d{openslo_slo_name="test-tiered-slo", openslo_spec_version="openslo/v1"}
        / on(openslo_slo_name, openslo_spec_version) group_left
        openslo_slo_error_budget{openslo_slo_name="test-tiered-slo", openslo_spec_version="openslo/v1"}
      labels:
        openslo_slo_name: test-tiered-slo
        openslo_spec_version: openslo/v1
        openslo_service_name: test-svc
    - record: openslo_slo_period_error_budget_remaining
      expr: clamp_min(1 - openslo_slo_period_burn_rate{openslo_slo_name="test-tiered-slo", openslo_spec_version="openslo/v1"}, 0)
      labels:
        openslo_slo_name: test-tiered-slo
        openslo_spec_version: openslo/v1
        openslo_service_name: test-svc
  - name: openslo-sli-recordings-test-tiered-slo
    rules:
    - record: openslo_sli_error_rate_5m
      expr: |
        1 - (
        sum(rate(http_requests_total{status=~"2.."}[5m]))
        ) / (
        sum(rate(http_requests_total[5m]))
        )
      labels:
        openslo_slo_name: test-tiered-slo
        openslo_spec_version: openslo/v1
        openslo_service_name: test-svc
    - record: openslo_sli_error_rate_30m
