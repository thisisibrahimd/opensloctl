        openslo_service_name: test-svc
    - record: openslo_sli_event_rate_7d
      expr: sum(rate(http_requests_total[7d]))
      labels:
        openslo_slo_name: test-tiered-slo
        openslo_spec_version: openslo/v1
        openslo_service_name: test-svc
    - record: openslo_sli_event_rate_28d
      expr: sum(rate(http_requests_total[28d]))
      labels:
        openslo_slo_name: test-tiered-slo
        openslo_spec_version: openslo/v1
        openslo_service_name: test-svc
    - record: openslo_sli_event_rate_30d
      expr: sum(rate(http_requests_total[30d]))
      labels:
        openslo_slo_name: test-tiered-slo
        openslo_spec_version: openslo/v1
        openslo_service_name: test-svc
  - name: openslo-status-recordings-test-tiered-slo
    rules:
    - record: openslo_slo_status
      expr: |
        (
          (openslo_slo_current_burn_rate{openslo_slo_name="test-tiered-slo", openslo_spec_version="openslo/v1"} >= bool 14.4)
          * 3
        )
        or
        (
          (openslo_slo_current_burn_rate{openslo_slo_name="test-tiered-slo", openslo_spec_version="openslo/v1"} >= bool 6)
          and
          (openslo_slo_current_burn_rate{openslo_slo_name="test-tiered-slo", openslo_spec_version="openslo/v1"} <  bool 14.4)
          * 2
        )
        or
        (
          (openslo_slo_current_burn_rate{openslo_slo_name="test-tiered-slo", openslo_spec_version="openslo/v1"} >= bool 1)
          and
          (openslo_slo_current_burn_rate{openslo_slo_name="test-tiered-slo", openslo_spec_version="openslo/v1"} <  bool 6)
          * 1
        )
      labels:
        openslo_slo_name: test-tiered-slo
        openslo_spec_version: openslo/v1
        openslo_service_name: test-svc
  - name: openslo-alerts-test-tiered-slo
    rules:
    - alert: TestTieredSloMultiWindowMultiBurnRate
      expr: |-
        (
        openslo_sli_error_rate_5m{openslo_slo_name="test-tiered-slo"} / (1 - openslo_slo_objective{openslo_slo_name="test-tiered-slo"}) >= 14.400000
        and
        openslo_sli_error_rate_1h{openslo_slo_name="test-tiered-slo"} / (1 - openslo_slo_objective{openslo_slo_name="test-tiered-slo"}) >= 14.400000)
        or
        (
        openslo_sli_error_rate_30m{openslo_slo_name="test-tiered-slo"} / (1 - openslo_slo_objective{openslo_slo_name="test-tiered-slo"}) >= 6.000000
        and
        openslo_sli_error_rate_6h{openslo_slo_name="test-tiered-slo"} / (1 - openslo_slo_objective{openslo_slo_name="test-tiered-slo"}) >= 6.000000)
      for: 2m
      labels:
        openslo_alert_severity: page
        openslo_notification_target: engineers
        openslo_slo_name: test-tiered-slo
        openslo_spec_version: openslo/v1
        openslo_service_name: test-svc
      annotations:
        summary: "Page multi-window multi-burn rate alert for SLO test-tiered-slo"
        description: "Threshold 14.4x and 6.0x over 5m and 1h and 30m and 6h"
    - alert: TestTieredSloMultiWindowMultiBurnRate
      expr: |-
        (
        openslo_sli_error_rate_2h{openslo_slo_name="test-tiered-slo"} / (1 - openslo_slo_objective{openslo_slo_name="test-tiered-slo"}) >= 3.000000
        and
        openslo_sli_error_rate_1d{openslo_slo_name="test-tiered-slo"} / (1 - openslo_slo_objective{openslo_slo_name="test-tiered-slo"}) >= 3.000000)
        or
        (
        openslo_sli_error_rate_6h{openslo_slo_name="test-tiered-slo"} / (1 - openslo_slo_objective{openslo_slo_name="test-tiered-slo"}) >= 1.000000
        and
        openslo_sli_error_rate_3d{openslo_slo_name="test-tiered-slo"} / (1 - openslo_slo_objective{openslo_slo_name="test-tiered-slo"}) >= 1.000000)
      for: 15m
      labels:
        openslo_alert_severity: ticket
        openslo_notification_target: engineers
        openslo_slo_name: test-tiered-slo
        openslo_spec_version: openslo/v1
        openslo_service_name: test-svc
      annotations:
        summary: "Ticket multi-window multi-burn rate alert for SLO test-tiered-slo"
        description: "Threshold 3.0x and 1.0x over 2h and 1d and 6h and 3d"
