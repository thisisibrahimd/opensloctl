apiVersion: 1
providers:
  - name: 'openslo'
    orgId: 1
    folder: 'OpenSLO'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      # Container-internal mount path. The host path is configured
      # via compose.slos.yaml volumes (`deploy/dashboards`).
      path: /etc/grafana/provisioning/dashboards
