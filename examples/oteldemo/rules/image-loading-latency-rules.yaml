groups:
  - name: openslo-info-recordings-image-loading-latency
    rules:
    - record: openslo_slo_info
      expr: vector(1)
      labels:
        openslo_slo_name: image-loading-latency
        openslo_slo_description: "95% of `image-provider` responses should complete under 2s, measured as the ratio of `le=\"2000\"` classic bucket counts to `_calls_total` on `service_name=\"image-provider\"` (target 0.95; trips on …"
        openslo_spec_version: openslo/v1
        chaos_flag: imageSlowLoad
        openslo_service_name: image-provider
        service: image-provider
    - record: openslo_slo_objective
      expr: vector(0.95)
      labels:
        openslo_slo_name: image-loading-latency
        openslo_spec_version: openslo/v1
        chaos_flag: imageSlowLoad
        openslo_service_name: image-provider
        service: image-provider
    - record: openslo_slo_timewindow_days
      expr: vector(30)
      labels:
        openslo_slo_name: image-loading-latency
        openslo_spec_version: openslo/v1
        chaos_flag: imageSlowLoad
        openslo_service_name: image-provider
        service: image-provider
    - record: openslo_slo_error_budget
      expr: vector(1- 0.95)
      labels:
        openslo_slo_name: image-loading-latency
        openslo_spec_version: openslo/v1
        chaos_flag: imageSlowLoad
        openslo_service_name: image-provider
        service: image-provider
    - record: openslo_slo_current_burn_rate
      expr: |
        openslo_sli_error_rate_5m{openslo_slo_name="image-loading-latency", openslo_spec_version="openslo/v1"}
        / on(openslo_slo_name, openslo_spec_version) group_left
        openslo_slo_error_budget{openslo_slo_name="image-loading-latency", openslo_spec_version="openslo/v1"}
      labels:
        openslo_slo_name: image-loading-latency
        openslo_spec_version: openslo/v1
        chaos_flag: imageSlowLoad
        openslo_service_name: image-provider
        service: image-provider
    - record: openslo_slo_period_burn_rate
      expr: |
        openslo_sli_error_rate_30d{openslo_slo_name="image-loading-latency", openslo_spec_version="openslo/v1"}
        / on(openslo_slo_name, openslo_spec_version) group_left
        openslo_slo_error_budget{openslo_slo_name="image-loading-latency", openslo_spec_version="openslo/v1"}
      labels:
        openslo_slo_name: image-loading-latency
        openslo_spec_version: openslo/v1
        chaos_flag: imageSlowLoad
        openslo_service_name: image-provider
        service: image-provider
    - record: openslo_slo_period_error_budget_remaining
      expr: clamp_min(1 - openslo_slo_period_burn_rate{openslo_slo_name="image-loading-latency", openslo_spec_version="openslo/v1"}, 0)
      labels:
        openslo_slo_name: image-loading-latency
        openslo_spec_version: openslo/v1
        chaos_flag: imageSlowLoad
        openslo_service_name: image-provider
        service: image-provider
  - name: openslo-sli-recordings-image-loading-latency
    rules:
    - record: openslo_sli_error_rate_5m
      expr: |
        1 - (
        sum(
          rate(
            traces_span_metrics_duration_milliseconds_bucket{
              service_name="image-provider",
              span_kind="SPAN_KIND_SERVER",
              span_name="image-provider",
              le="2000"
            }[5m]
          )
        )
        
        ) / (
        sum(
          rate(
            traces_span_metrics_calls_total{
              service_name="image-provider",
              span_kind="SPAN_KIND_SERVER",
              span_name="image-provider"
            }[5m]
          )
        )
        
        )
      labels:
        openslo_slo_name: image-loading-latency
        openslo_spec_version: openslo/v1
