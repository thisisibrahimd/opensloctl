groups:
  - name: openslo-info-recordings-frontend-availability
    rules:
    - record: openslo_slo_info
      expr: vector(1)
      labels:
        openslo_slo_name: frontend-availability
        openslo_slo_description: "95% of frontend HTTP SERVER calls should succeed (target 0.95)."
        openslo_spec_version: openslo/v1
        openslo_service_name: frontend
        service: frontend
    - record: openslo_slo_objective
      expr: vector(0.99)
      labels:
        openslo_slo_name: frontend-availability
        openslo_spec_version: openslo/v1
        openslo_service_name: frontend
        service: frontend
    - record: openslo_slo_timewindow_days
      expr: vector(30)
      labels:
        openslo_slo_name: frontend-availability
        openslo_spec_version: openslo/v1
        openslo_service_name: frontend
        service: frontend
    - record: openslo_slo_error_budget
      expr: vector(1- 0.99)
      labels:
        openslo_slo_name: frontend-availability
        openslo_spec_version: openslo/v1
        openslo_service_name: frontend
        service: frontend
    - record: openslo_slo_current_burn_rate
      expr: |
        openslo_sli_error_rate_5m{openslo_slo_name="frontend-availability", openslo_spec_version="openslo/v1"}
        / on(openslo_slo_name, openslo_spec_version) group_left
        openslo_slo_error_budget{openslo_slo_name="frontend-availability", openslo_spec_version="openslo/v1"}
      labels:
        openslo_slo_name: frontend-availability
        openslo_spec_version: openslo/v1
        openslo_service_name: frontend
        service: frontend
    - record: openslo_slo_period_burn_rate
      expr: |
        openslo_sli_error_rate_30d{openslo_slo_name="frontend-availability", openslo_spec_version="openslo/v1"}
        / on(openslo_slo_name, openslo_spec_version) group_left
        openslo_slo_error_budget{openslo_slo_name="frontend-availability", openslo_spec_version="openslo/v1"}
      labels:
        openslo_slo_name: frontend-availability
        openslo_spec_version: openslo/v1
        openslo_service_name: frontend
        service: frontend
    - record: openslo_slo_period_error_budget_remaining
      expr: clamp_min(1 - openslo_slo_period_burn_rate{openslo_slo_name="frontend-availability", openslo_spec_version="openslo/v1"}, 0)
      labels:
        openslo_slo_name: frontend-availability
        openslo_spec_version: openslo/v1
        openslo_service_name: frontend
        service: frontend
  - name: openslo-sli-recordings-frontend-availability
    rules:
    - record: openslo_sli_error_rate_5m
      expr: |
        1 - (
        sum(rate(traces_span_metrics_calls_total{service_name="frontend", span_kind="SPAN_KIND_SERVER", status_code!="STATUS_CODE_ERROR"}[5m]))
        ) / (
        sum(rate(traces_span_metrics_calls_total{service_name="frontend", span_kind="SPAN_KIND_SERVER"}[5m]))
        )
      labels:
        openslo_slo_name: frontend-availability
