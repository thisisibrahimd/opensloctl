apiVersion: openslo/v1
kind: SLO
metadata:
  name: payment-availability
  displayName: Checkout Payment Availability
  labels:
    chaos_flag: paymentServiceUnreachable
    service: checkout
spec:
  service: checkout
  description: "99% of `POST /api/checkout` should not encounter a payment-unreachable error, measured via frontend HTTP SERVER `POST /api/checkout` (target 0.99; trips on `paymentServiceUnreachable`)."
  indicator:
    metadata:
      name: payment-availability-sli
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: sum(rate(traces_span_metrics_calls_total{service_name="frontend", span_kind="SPAN_KIND_SERVER", span_name="POST /api/checkout", status_code!="STATUS_CODE_ERROR"}[{{.Window}}]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: sum(rate(traces_span_metrics_calls_total{service_name="frontend", span_kind="SPAN_KIND_SERVER", span_name="POST /api/checkout"}[{{.Window}}]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: 99% of checkout attempts avoid effective payment-availability (baseline-adjusted)
      target: 0.99
  alertPolicies:
    - alertPolicyRef: burnrate-page-fast-5m-policy
    - alertPolicyRef: burnrate-page-fast-1h-policy
    - alertPolicyRef: burnrate-page-slow-30m-policy
    - alertPolicyRef: burnrate-page-slow-6h-policy
    - alertPolicyRef: burnrate-ticket-fast-2h-policy
    - alertPolicyRef: burnrate-ticket-fast-1d-policy
    - alertPolicyRef: burnrate-ticket-slow-6h-policy
    - alertPolicyRef: burnrate-ticket-slow-3d-policy
