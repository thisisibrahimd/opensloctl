apiVersion: openslo/v1
kind: AlertPolicy
metadata:
  name: burnrate-page-fast-5m-policy
spec:
  description: Page tier fast (5m window)
  alertWhenBreaching: true
  conditions:
    - conditionRef: burnrate-page-fast-5m
  notificationTargets:
    - targetRef: engineers
