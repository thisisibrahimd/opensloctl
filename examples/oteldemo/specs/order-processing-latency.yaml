apiVersion: openslo/v1
kind: SLO
metadata:
  name: order-processing-latency
  displayName: Order Processing Latency
  labels:
    chaos_flag: kafkaQueueProblems
    service: checkout
spec:
  service: checkout
  description: "95% of `POST /api/checkout` should complete under 60s, measured as the ratio of `le=\"60000\"` classic bucket counts to `_calls_total` on frontend HTTP SERVER (target 0.95; trips on `kafkaQueueProblems`)."
  indicator:
    metadata:
      name: order-processing-latency-sli
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(
                  rate(
                    traces_span_metrics_duration_milliseconds_bucket{
                      service_name="frontend",
                      span_kind="SPAN_KIND_SERVER",
                      span_name="POST /api/checkout",
                      le="300000"
                    }[{{.Window}}]
                  )
                )
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(
                  rate(
                    traces_span_metrics_calls_total{
                      service_name="frontend",
                      span_kind="SPAN_KIND_SERVER",
                      span_name="POST /api/checkout"
                    }[{{.Window}}]
                  )
                )
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: 95% of POST /api/checkout under 60s
      target: 0.95
  alertPolicies:
    - alertPolicyRef: burnrate-page-fast-5m-policy
    - alertPolicyRef: burnrate-page-fast-1h-policy
    - alertPolicyRef: burnrate-page-slow-30m-policy
    - alertPolicyRef: burnrate-page-slow-6h-policy
    - alertPolicyRef: burnrate-ticket-fast-2h-policy
    - alertPolicyRef: burnrate-ticket-fast-1d-policy
    - alertPolicyRef: burnrate-ticket-slow-6h-policy
    - alertPolicyRef: burnrate-ticket-slow-3d-policy
