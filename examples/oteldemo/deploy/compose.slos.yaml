services:
  prometheus:
    command:
      - --config.file=/etc/prometheus/specs/prometheus-config.yaml
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
      - --web.route-prefix=/
      - --web.enable-otlp-receiver
      - --enable-feature=exemplar-storage
    volumes:
      - ../prometheus:/etc/prometheus/specs
      - ../../rules:/etc/prometheus/rules

  grafana:
    ports:
      - "3000:3000"
    volumes:
      # Bind the repo-root dashboards (JSON files) into Grafana's
      # provisioning path.
      - ../../dashboards:/etc/grafana/provisioning/dashboards
      # Bind the provisioning yaml (single file) alongside the
      # JSONs so Grafana's file provider config gets loaded at startup.
      - ../openslo-dashboards.yaml:/etc/grafana/provisioning/dashboards/openslo-dashboards.yaml

  jaeger:
    ports:
      - "16686:16686"
      - "4317:4317"
