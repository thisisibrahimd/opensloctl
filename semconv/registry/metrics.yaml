file_format: definition/2

metrics:
  - name: openslo.slo.info
    instrument: gauge
    unit: "1"
    stability: development
    requirement_level: recommended
    brief: Identifies the existence of an SLO. Always has value 1.
    attributes:
      - ref: openslo.slo.name
        requirement_level: required
      - ref: openslo.spec.version
        requirement_level: required

  - name: openslo.slo.objective
    instrument: gauge
    unit: "1"
    stability: development
    requirement_level: recommended
    brief: The target SLI objective (e.g., 0.999 for 99.9% availability).
    attributes:
      - ref: openslo.slo.name
        requirement_level: required
      - ref: openslo.spec.version
        requirement_level: required

  - name: openslo.slo.timewindow_days
    instrument: gauge
    unit: "1"
    stability: development
    requirement_level: recommended
    brief: The SLO time window duration expressed as a number of days.
    attributes:
      - ref: openslo.slo.name
        requirement_level: required
      - ref: openslo.spec.version
        requirement_level: required

  - name: openslo.slo.error_budget
    instrument: gauge
    unit: "1"
    stability: development
    requirement_level: recommended
    brief: The error budget calculated as 1 minus the objective.
    attributes:
      - ref: openslo.slo.name
        requirement_level: required
      - ref: openslo.spec.version
        requirement_level: required

  - name: openslo.slo.current_burn_rate
    instrument: gauge
    unit: "1"
    stability: development
    requirement_level: recommended
    brief: Instantaneous error-budget burn rate = 5-minute SLI error rate divided by the error budget.
    attributes:
      - ref: openslo.slo.name
        requirement_level: required
      - ref: openslo.spec.version
        requirement_level: required
      - ref: openslo.service.name
        requirement_level: recommended

  - name: openslo.slo.period_burn_rate
    instrument: gauge
    unit: "1"
    stability: development
    requirement_level: recommended
    brief: Period error-budget burn rate = full-window SLI error rate (typically 30d) divided by the error budget.
    attributes:
      - ref: openslo.slo.name
        requirement_level: required
      - ref: openslo.spec.version
        requirement_level: required
      - ref: openslo.service.name
        requirement_level: recommended

  - name: openslo.slo.period_error_budget_remaining
    instrument: gauge
    unit: "1"
    stability: development
    requirement_level: recommended
    brief: Remaining error budget ratio over the full period = 1 minus period_burn_rate (1 = full budget remaining).
    attributes:
      - ref: openslo.slo.name
        requirement_level: required
      - ref: openslo.spec.version
        requirement_level: required
      - ref: openslo.service.name
        requirement_level: recommended

  - name: openslo.sli.error_rate_5m
    instrument: gauge
    unit: "1"
    stability: development
    requirement_level: recommended
    brief: SLI error rate over a 5-minute window.
    attributes:
      - ref: openslo.slo.name
        requirement_level: required
      - ref: openslo.spec.version
        requirement_level: required

  - name: openslo.sli.error_rate_30m
    instrument: gauge
    unit: "1"
    stability: development
    requirement_level: recommended
    brief: SLI error rate over a 30-minute window.
    attributes:
      - ref: openslo.slo.name
        requirement_level: required
      - ref: openslo.spec.version
