file_format: definition/2

attributes:
  - key: openslo.slo.name
    type: string
    stability: development
    brief: The name of the SLO as defined in the OpenSlo spec.

  - key: openslo.slo.description
    type: string
    stability: development
    brief: The free-form description of the SLO as defined in the OpenSlo spec's `spec.description` field, folded to a single line.

  - key: openslo.spec.version
    type: string
    stability: development
    brief: The OpenSlo API version of the SLO spec.

  - key: openslo.service.name
    type: string
    stability: development
    brief: The name of the service the SLO belongs to.

  - key: openslo.alert.severity
    type: string
    stability: development
    brief: The alert severity (e.g., page, ticket) attached to SLO alert rules.

  - key: openslo.notification.target
    type: string
    stability: development
    brief: The notification target for an alert (e.g., pagerduty, slack, engineers).

  - key: openslo.objective.decimal
    type: double
    stability: development
    brief: The SLO objective expressed as a decimal value (e.g., 0.999).
    deprecated:
      reason: obsoleted
      note: Unused in opensloctl; no recording rule emits this attribute. The objective value is baked into the openslo_slo_objective recording rule directly.

  - key: openslo.objective.percent
    type: double
    stability: development
    brief: The SLO objective expressed as a percentage (e.g., 99.9).
    deprecated:
      reason: obsoleted
      note: Unused in opensloctl; no recording rule emits this attribute.

  - key: openslo.timewindow.duration
    type: string
    stability: development
    brief: The time window duration for the SLO (e.g., 28d).
    deprecated:
      reason: obsoleted
      note: Unused in opensloctl; the time window is encoded as part of the SLI error rate windowed recording rules.
